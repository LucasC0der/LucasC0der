name: Contribution Snake

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate contribution snake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate animated GIFs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.gif?palette=github&color_snake=58A6FF
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=58A6FF

      - name: Publish generated snake
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake.gif output/github-contribution-grid-snake.gif
          cp dist/github-contribution-grid-snake-dark.gif output/github-contribution-grid-snake-dark.gif
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.gif output/github-contribution-grid-snake-dark.gif
          if git diff --cached --quiet; then
            echo "Snake sem alterações."
          else
            git commit -m "chore: update contribution snake"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
